# Config for the gateway container in deploy/docker-compose.yml.
# Sections below that no phase reads yet (batching) are left empty/default;
# see docs/adr/0002.
#
# cache.semantic's model/vocab/runtime paths are left unset here on purpose:
# deploy/Dockerfile sets ONNXRUNTIME_LIB_PATH, EMBEDDING_MODEL_PATH, and
# EMBEDDING_VOCAB_PATH as image environment variables pointing at the
# assets it fetches at build time, which main.go's asset-path resolution
# falls back to when these YAML fields are empty. See docs/adr/0012.
#
# The two mock providers below are deliberately set up to demonstrate
# Phase 3's failover live: "primary" always returns 429, so every request
# retries it twice (retry.max_attempts_per_provider), then falls over to
# "secondary", which always succeeds. curl the gateway a few times and
# watch X-Gateway-Attempts and X-Gateway-Provider on the response.

server:
  addr: ":8080"
  read_timeout: 30s
  request_timeout: 120s
  max_body_bytes: 1048576
  shutdown_timeout: 15s

redis:
  addr: "redis:6379"
  db: 0
  dial_timeout: 2s

postgres:
  dsn_env: POSTGRES_DSN
  ping_timeout: 2s

providers:
  - name: primary
    type: mock
    priority: 0
    weight: 1
    timeout: 5s
    latency: 20ms
    failure_rate: 1
    failure_status: 429
  - name: secondary
    type: mock
    priority: 1
    weight: 1
    timeout: 5s
    latency: 20ms
    failure_rate: 0

model_aliases:
  fast:
    primary: mock-model-v1
    secondary: mock-model-v1

breaker:
  error_rate_threshold: 0.5
  min_requests: 20
  window: 30s
  cooldown: 10s
  cooldown_max: 5m
  half_open_probes: 3
  prober_interval: 15s

retry:
  max_attempts_per_provider: 2
  base_backoff: 200ms
  max_backoff: 5s

rate_limit:
  default_tpm: 200000
  estimate_completion_tokens: 512
  fail_open: true # availability over cost control, per the README's stated trade-off

cache:
  exact:
    enabled: true
    ttl: 1h
    cache_nonzero_temperature: false
  semantic:
    enabled: true
    threshold: 0.89 # measured, see docs/eval/semantic_cache_eval.md and docs/adr/0012
    embedding_model: all-MiniLM-L6-v2
    hnsw: { m: 16, ef_construction: 200, ef_search: 64 }
    max_vectors: 500000
    ttl: 1h
    persist_path: /data/semantic_cache.gob

ledger:
  buffer_size: 10000
  batch_size: 200
  flush_interval: 1s

observability:
  log_level: info
  log_request_bodies: false
