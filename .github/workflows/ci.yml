name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test -race
        run: go test ./... -race

      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
